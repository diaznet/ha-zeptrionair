# Tooling configuration only; the integration itself is installed via HACS.
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["custom_components.zeptrionair"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "C4", "RET"]
ignore = ["ASYNC109"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC110", "RUF012"]
