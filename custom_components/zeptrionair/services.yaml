store_scene:
  target:
    entity:
      integration: zeptrionair
      domain:
        - cover
        - light
  fields:
    scene:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 4
          mode: box

recall_scene:
  target:
    entity:
      integration: zeptrionair
      domain:
        - cover
        - light
  fields:
    scene:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 4
          mode: box

move_step:
  target:
    entity:
      integration: zeptrionair
      domain: cover
  fields:
    direction:
      required: true
      example: down
      selector:
        select:
          translation_key: direction
          options:
            - up
            - down
    duration:
      example: 250
      selector:
        number:
          min: 100
          max: 32000
          step: 50
          unit_of_measurement: ms
          mode: box

write_name:
  target:
    entity:
      integration: zeptrionair
      domain:
        - cover
        - light
  fields:
    name:
      example: Kitchen
      selector:
        text:
    group:
      example: Ground floor
      selector:
        text:

calibrate:
  target:
    entity:
      integration: zeptrionair
      domain: cover

program_smartbutton:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: zeptrionair
    commands:
      example: "[{entity_id: cover.office_shade, command: recall_s1}, {entity_id: light.terrace, command: toggle}]"
      selector:
        object:
    requests:
      example: '[{"req": "GET", "loc": "192.168.1.20", "pth": "/api/scene/1"}]'
      selector:
        object:
    wait:
      default: 60
      selector:
        number:
          min: 10
          max: 120
          unit_of_measurement: s
          mode: box
