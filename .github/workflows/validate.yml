name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  workflow_call: # the release workflow runs the full validation first

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@07f46fd2e19967768b5fd3000f91f857452b767c # master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  lint:
    name: Lint, translations, versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
      - name: Read the ruff version from requirements_test.txt (kept up to date by Dependabot)
        id: ruff
        run: |
          version="$(sed -n 's/^ruff==\([^ #]*\).*/\1/p' requirements_test.txt)"
          if [ -z "$version" ]; then
            echo "::error::requirements_test.txt does not pin ruff==x.y.z"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Ruff check
        env:
          RUFF_VERSION: ${{ steps.ruff.outputs.version }}
        run: uvx "ruff==${RUFF_VERSION}" check .
      - name: Ruff format
        env:
          RUFF_VERSION: ${{ steps.ruff.outputs.version }}
        run: uvx "ruff==${RUFF_VERSION}" format --check .
      - run: python scripts/check_translations.py
      - run: python scripts/check_versions.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: requirements_test.txt
      - run: uv venv && uv pip install -r requirements_test.txt
      - run: uv run --no-project pytest --cov --cov-report=term-missing
